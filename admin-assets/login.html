<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#060b0b">
  <title>Owner sign in · Predict2U</title>
  <link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body class="login-body">
  <div class="ambient ambient-one" aria-hidden="true"></div><div class="ambient ambient-two" aria-hidden="true"></div>
  <main class="login-card">
    <div class="brand-mark" aria-hidden="true">P2U</div>
    <p class="eyebrow"><span class="lock-symbol">◆</span> Private analytics</p>
    <h1>Welcome back,<br><span>boss.</span></h1>
    <p class="login-copy">Your audience, live. Sign in to open the Predict2U command centre.</p>
    {{ERROR}}
    <form method="post" action="/admin/login">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" value="predict2u@gmail.com" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="primary-button" type="submit">Open command centre <span aria-hidden="true">→</span></button>
    </form>
    <p class="privacy-note"><span aria-hidden="true">●</span> Protected owner access · Secure session</p>
    <a class="back-link" href="https://predict2u.com/">← Back to Predict2U</a>
  </main>
</body>
</html>
