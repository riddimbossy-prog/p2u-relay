services:
  - type: web
    name: p2u-relay
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: "true"
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ADMIN_EMAIL
        value: predict2u@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: LOCK_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
