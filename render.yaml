services:
  - type: keyvalue
    name: p2u-relay-kv
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []
  - type: web
    name: p2u-relay
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: "true"
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ADMIN_EMAIL
        value: predict2u@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD_SHA256
        sync: false
      - key: LOCK_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          name: p2u-relay-kv
          type: keyvalue
          property: connectionString
